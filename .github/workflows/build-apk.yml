name: Build APK Aula Facil

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Restaurar e validar projeto completo
        run: |
          mkdir -p full_src
          cat \
            payload/part-00.b64 \
            payload5k/part-004.b64 \
            payload5k/part-005.b64 \
            payload5k/part-006.b64 \
            payload5k/part-007.b64 \
            payload/part-02.b64 \
            payload/part-03.b64 \
            payload/part-04.b64 \
            payload/part-05.b64 \
            | base64 -d > full_src/aula_facil.zip
          echo 'c6c2f72f58c24e6f049f728c9eb8b9d79ed0029c97e649d419a8b022287f4d7a  full_src/aula_facil.zip' | sha256sum -c -
          unzip -t full_src/aula_facil.zip
          cd full_src
          unzip -q aula_facil.zip
          test -f aula_facil/pubspec.yaml

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Criar shell Android
        working-directory: full_src/aula_facil
        run: flutter create . --platforms=android --org com.willian.aulafacil --project-name aula_facil

      - name: Aplicar configuracao Android
        working-directory: full_src/aula_facil
        run: python3 tool/prepare_android_ci.py

      - name: Instalar dependencias
        working-directory: full_src/aula_facil
        run: flutter pub get

      - name: Analisar codigo
        working-directory: full_src/aula_facil
        run: flutter analyze --no-fatal-infos

      - name: Executar testes
        working-directory: full_src/aula_facil
        run: flutter test

      - name: Gerar APK release
        working-directory: full_src/aula_facil
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: aula-facil-apk
          path: full_src/aula_facil/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
