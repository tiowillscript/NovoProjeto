name: Build APK Aula Facil

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Criar projeto Android
        run: flutter create . --platforms=android --org com.willian.aulafacil --project-name aula_facil

      - name: Nome do aplicativo
        run: sed -i 's/android:label="aula_facil"/android:label="Aula Fácil"/' android/app/src/main/AndroidManifest.xml

      - name: Dependencias
        run: flutter pub get

      - name: Gerar APK release
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: aula-facil-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
